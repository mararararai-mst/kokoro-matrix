<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心マトリクス シート（おうち版）</title>
<meta name="description" content="葛原祥太さんの「心マトリクス」を家で使うための書きこみシート（A4）。きょうのできごと・Q・いま●とつぎ★・まずやること。">
<meta property="og:title" content="心マトリクス シート（おうち版）">
<meta property="og:description" content="印刷して、親子で書きこむ心マトリクスのシート。">
<meta property="og:image" content="https://mararararai-mst.github.io/kokoro-matrix/assets/kokoro-matrix.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
@page{ size:A4 portrait; margin:0 }
:root{
  --ink:#3d342c; --sub:#7d6f62; --line:#cdb9a3; --accent:#f0a45c;
}
body.bw{ --ink:#000; --sub:#333; --line:#000; --accent:#000 }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9e4de}
body{
  font-family:"UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","Zen Maru Gothic",sans-serif;
  color:var(--ink);
}
.page{
  width:210mm;height:297mm;margin:8mm auto;background:#fff;
  padding:11mm 12mm 9mm;display:flex;flex-direction:column;gap:3.2mm;
  box-shadow:0 2px 12px rgba(0,0,0,.12);overflow:hidden;
}
@media print{ html,body{background:#fff} .page{margin:0;box-shadow:none} }

/* 見出し */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:6mm}
h1{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;margin:0;
  font-size:21pt;letter-spacing:.04em;line-height:1.3;white-space:nowrap;
}
h1 rt{font-size:.42em;font-weight:500;letter-spacing:0}
h1 .sm{font-size:.6em;color:var(--sub);margin-left:.3em}
.who{display:flex;flex-direction:column;gap:2.4mm;font-size:12pt;min-width:78mm}
.who .row{display:flex;align-items:flex-end;gap:2mm;white-space:nowrap}
.who .ul{flex:1;border-bottom:1.6px solid var(--ink);height:7mm}
.who .date{justify-content:flex-end}
.who .date .blank{display:inline-block;width:13mm;border-bottom:1.6px solid var(--ink);height:7mm}

/* 書きこみ欄 */
.box{
  border:2px solid var(--line);border-radius:4mm;padding:1.6mm 3.5mm;position:relative;
}
.box .lb{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:11pt;color:var(--sub)}
.dekigoto{height:26mm}
.yarukoto{height:21mm}
.yarukoto .lb::before,.dekigoto .lb::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--accent);margin-right:.35em;vertical-align:.12em}

/* 図 */
.fig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.fig svg{height:100%;max-height:150mm;width:auto;display:block}
.yakusoku{
  font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:11.5pt;color:var(--ink);
  text-align:center;margin-top:.6mm;white-space:nowrap;
}
.yakusoku .mk{font-size:1.25em;vertical-align:-.08em}
.yakusoku .now{color:#e8638f} .yakusoku .next{color:#e0a400}
body.bw .yakusoku .now, body.bw .yakusoku .next{color:#000}

/* 下：おうちの人へ */
.foot{display:flex;gap:4mm;align-items:stretch}
.otona{
  flex:1;border:1.4px dashed var(--line);border-radius:3mm;padding:1.8mm 3.5mm;font-size:9.5pt;line-height:1.65;
}
.otona b{font-family:"Zen Maru Gothic",sans-serif;font-size:10pt}
.otona ul{margin:.3mm 0 0;padding-left:1.1em}
.otona .note{color:var(--sub);font-size:8.6pt}
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;width:27mm;font-size:8pt;text-align:center;line-height:1.35;color:var(--sub)}
.qr img{width:22mm;height:22mm;display:block}
body.home .v-dt, body.dt .v-home{display:none !important}
.dt-head{align-items:center}
.dt-name{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:17pt;display:flex;align-items:center;white-space:nowrap}
.dt-name span{display:inline-block;width:68mm}
.dt-title{height:22mm;border-color:#000;border-width:2.4px;border-radius:0}
.dt-title .lb{color:#000;font-size:11pt}
body.dt .fig svg{max-height:190mm}
.credit{font-size:7.5pt;color:var(--sub);text-align:right;margin-top:-1.6mm}
</style>
</head>
<body>
<div class="page">

  <div class="head v-home">
    <h1><ruby>心<rt>しん</rt></ruby>マトリクス シート</h1>
    <div class="who">
      <div class="row">なまえ<span class="ul"></span></div>
      <div class="row date"><span class="blank"></span>がつ<span class="blank"></span>にち</div>
    </div>
  </div>

  <div class="box dekigoto v-home"><span class="lb">きょうの できごと</span></div>

  <div class="head v-dt dt-head">
    <h1>道徳シート</h1>
    <div class="dt-name">名前【<span></span>】</div>
  </div>
  <div class="box dt-title v-dt"><span class="lb">題名</span></div>

  <div class="fig">
    <svg id="mx" viewBox="0 0 900 900" role="img" aria-label="心マトリクスの図"></svg>
    <div class="yakusoku v-home">
      いまの こころに <span class="mk now">●</span>　いきたい ところに <span class="mk next">★</span>　→ で つなごう
    </div>
  </div>

  <div class="box yarukoto v-home"><span class="lb">つぎに いくために、まず やること</span></div>

  <div class="foot v-home">
    <div class="otona">
      <b>おうちの人へ</b>　まん中の「Q」に、問いを ひとつ 書いてください。<br>
      <ul>
        <li>そのとき、どんな こころだった？</li>
        <li>どこに いけたら いいと おもう？</li>
        <li>あいての こころは、どこに いたと おもう？</li>
      </ul>
      <span class="note">わるい場所は ひとつもありません。おとなが 場所を きめず、本人が 自分で かきます。</span>
    </div>
    <div class="qr">
      <img src="assets/qr-app.svg" alt="アプリのQRコード">
      アプリでも<br>できます
    </div>
  </div>
  <div class="credit">図のもと：葛原祥太「心マトリクス」（葛原学習研究所）</div>

</div>

<script>
(function(){
'use strict';
var bw=/[?&]bw=1/.test(location.search);
if(bw) document.body.classList.add('bw');
var DT=/[?&]v=doutoku/.test(location.search);
document.body.classList.add(DT?'dt':'home');
if(DT) document.title='道徳シート（心マトリクス）';
function kata(t){ return t.replace(/[ぁ-ゖ]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)+0x60); }); }

var NS='http://www.w3.org/2000/svg', svg=document.getElementById('mx');
function el(n,a,parent){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); (parent||svg).appendChild(e); return e; }
/* 道徳シートは中に書きこむので、円を大きくし、絵と名前は円の外へ出す */
var VB=DT?1120:900, C=VB/2, RO=DT?400:330, RI=DT?200:170, RM=DT?468:RO, MID=(RO+RI)/2;
svg.setAttribute('viewBox','0 0 '+VB+' '+VB);
var INK=bw?'#000':'#5b5047', GRAY=bw?'#777':'#cfcfcf';
var FONT='"UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","Zen Maru Gothic",sans-serif';
var MARU='"Zen Maru Gothic",sans-serif';

/* 円 */
el('circle',{cx:C,cy:C,r:RO,fill:'none',stroke:GRAY,'stroke-width':4});
el('circle',{cx:C,cy:C,r:RI,fill:'none',stroke:GRAY,'stroke-width':4});

/* 軸（点線） */
var dash={'stroke-width':4,'stroke-dasharray':'3 9','stroke-linecap':'round'};
function line(x1,y1,x2,y2,col){ var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:bw?'#666':col}; for(var k in dash) a[k]=dash[k]; el('line',a); }
var LE=DT?RM-46:RO;
line(C,C-LE,C,C+LE,'#5cb8b2');
line(C-LE,C,C,C,'#9a6fd6');
line(C,C,C+LE,C,'#e07a6a');

/* 軸の言葉（ふりがなは手で置く） */
var FS=30, RFS=13, RUBY=!DT;
/* text：言葉、vert：縦書き、ruby：[[何文字目, よみ, 何文字ぶん]] */
function word(x,y,text,vert,ruby){
  ruby=RUBY?(ruby||[]):[];
  var n=text.length, L=n*FS, pad=8, rb=ruby.length?RFS+4:0;
  if(vert) el('rect',{x:x-FS/2-pad,y:y-L/2-pad,width:FS+pad*2+rb,height:L+pad*2,fill:'#fff'});
  else     el('rect',{x:x-L/2-pad,y:y-FS/2-pad-rb,width:L+pad*2,height:FS+pad*2+rb,fill:'#fff'});
  for(var i=0;i<n;i++){
    var cx=vert?x:x-L/2+(i+.5)*FS, cy=vert?y-L/2+(i+.5)*FS:y;
    var t=el('text',{x:cx,y:cy,'text-anchor':'middle','dominant-baseline':'central','font-size':FS,fill:INK,'font-family':FONT});
    t.textContent=text.charAt(i);
  }
  ruby.forEach(function(r){
    var mid=r[0]+r[2]/2;
    var rx=vert?x+FS/2+RFS/2+2:x-L/2+mid*FS, ry=vert?y-L/2+mid*FS:y-FS/2-RFS/2-2;
    var rt=el('text',{x:rx,y:ry,'text-anchor':'middle','dominant-baseline':'central','font-size':RFS,fill:INK,'font-family':FONT});
    if(vert){ rt.setAttribute('writing-mode','vertical-rl'); rt.setAttribute('style','writing-mode:vertical-rl;letter-spacing:0'); }
    rt.textContent=r[1];
  });
}
word(C,C-MID,DT?'動く':'やってみる',false);
word(C,C-RI+38,'考える',false,[[0,'かんが',1]]);
word(C,C+RI-38,'考えない',false,[[0,'かんが',1]]);
word(C,C+MID,DT?'動かない':'やらされる',false);
word(C-MID+22,C,'自分ばかり',true,[[0,'じぶん',2]]);
word(C-RI+38,C,'疑う',false,[[0,'うたが',1]]);
word(C+RI-26,C,'信じる',false,[[0,'しん',1]]);
word(C+MID-20,C,'思いやる',true,[[0,'おも',1]]);

/* まん中のQ */
el('rect',{x:C-92,y:C-66,width:184,height:132,rx:DT?0:12,fill:'#fff',stroke:(bw||DT)?'#000':'#6b5d50','stroke-width':DT?5:4});
var q=el('text',{x:C-80,y:C-42,'font-size':30,'font-weight':700,fill:(bw||DT)?'#000':'#6b5d50','font-family':MARU,'dominant-baseline':'central'});
q.textContent='Q';

/* 8つの場所：原図から切り出した絵＋なまえ */
var S=[
  {n:'ぐんぐん',img:'moon',  a:90,  col:'#1f9bd7', lx:0,  ly:-62},
  {n:'きらきら',img:'star',  a:45,  col:'#e3b100', lx:58, ly:-52},
  {n:'にこにこ',img:'sun',   a:0,   col:'#f08a45', lx:0,  ly:-60},
  {n:'ふわふわ',img:'flower',a:-45, col:'#4fb85a', lx:58, ly:56},
  {n:'だらだら',img:'puddle',a:-90, col:'#8d8d8d', lx:0,  ly:58},
  {n:'どろどろ',img:'swirl', a:-135,col:'#7f52d9', lx:-58,ly:56},
  {n:'もやもや',img:'cloud', a:180, col:'#8a5a33', lx:0,  ly:-60},
  {n:'いらいら',img:'bolt',  a:135, col:'#ef5b74', lx:-58,ly:-52}
];
var SIZE={moon:[52,68],star:[64,70],sun:[74,72],flower:[52,66],puddle:[104,44],swirl:[64,62],cloud:[80,56],bolt:[58,68]};
S.forEach(function(s){
  var rad=s.a*Math.PI/180, x=C+RM*Math.cos(rad), y=C-RM*Math.sin(rad), sz=SIZE[s.img];
  el('circle',{cx:x,cy:y,r:Math.max(sz[0],sz[1])/2+4,fill:'#fff'});
  var im=el('image',{href:'assets/icons/'+s.img+'.png',x:x-sz[0]/2,y:y-sz[1]/2,width:sz[0],height:sz[1]});
  if(bw) im.setAttribute('style','filter:grayscale(1) contrast(1.15)');
  var t=el('text',{x:x+s.lx,y:y+s.ly,'text-anchor':'middle','dominant-baseline':'central','font-size':32,'font-weight':700,fill:bw?'#000':s.col,'font-family':MARU,'letter-spacing':1});
  t.textContent=DT?kata(s.n):s.n;
});
})();
</script>
</body>
</html>
